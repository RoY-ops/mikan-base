<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091e2b"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>MIKAN BASE｜国際救助隊</title><style>:root{font-family:system-ui,sans-serif;color:#eaf5f5;background:#081923}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#224655,#081923 75%)}main{max-width:600px;margin:auto;padding:18px 13px 95px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}h1{margin:2px 0;font-size:24px;letter-spacing:1px}small,.muted{color:#b4ced5;font-size:12px}.badge{background:#183e35;border:1px solid #4c9676;color:#adf2b9;border-radius:18px;padding:7px;font-size:11px}.card{background:#142e3d;border:1px solid #345567;border-radius:14px;padding:15px;margin-top:12px}h2{font-size:17px;margin:0 0 11px}.scene{height:230px;position:relative;overflow:hidden;border-radius:15px;border:1px solid #638796;background:linear-gradient(#336a85,#8eb7b5 58%,#295f74 59%,#346b7d 68%,#244c35 69%)}.sun{position:absolute;right:45px;top:25px;width:55px;height:55px;border-radius:50%;background:#ffe0a3;box-shadow:0 0 50px #fff4b5}.hill{position:absolute;bottom:-60px;left:-15%;width:130%;height:160px;border-radius:50% 50% 0 0;background:#305b38;border-top:10px solid #508357}.trees{position:absolute;bottom:55px;left:5%;font-size:26px;letter-spacing:8px}.silo{position:absolute;left:44%;bottom:-15px;width:65px;height:108px;background:#0b1720;border:4px solid #7c9aa2;border-radius:20px 20px 0 0;opacity:0;transition:opacity 1s}.rocket{position:absolute;left:calc(50% - 16px);bottom:-90px;width:33px;height:96px;background:linear-gradient(90deg,#799aaa,#f6f8ee,#6a869b);border-radius:50% 50% 10% 10%;border-top:18px solid #e66f4e;opacity:0;transition:bottom 3s ease-in,opacity .4s}.rocket:after{content:"";position:absolute;left:7px;bottom:-65px;width:20px;height:70px;background:linear-gradient(#fff4b7,#ff922e,transparent);filter:blur(4px)}.scene.launch .silo{opacity:1}.scene.launch .rocket{opacity:1;bottom:320px}.tag{position:absolute;top:9px;left:9px;padding:6px;background:#0a2635af;border-radius:6px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.stat{text-align:center;background:#163747;padding:11px 4px;border-radius:9px}.stat b{display:block;font-size:23px;margin-top:4px}.btn{width:100%;border:0;border-radius:10px;background:#e4a64c;color:#0e2531;padding:12px;font-weight:800;font-size:15px;margin-top:9px}.btn.alt{background:#295367;color:#f2f5f6;border:1px solid #597b8b}.item{padding:12px;border-radius:10px;background:#1c3d4e;margin:8px 0}.item b{display:block;margin-bottom:5px}.meter{height:7px;background:#396175;border-radius:8px;margin-top:7px}.meter i{display:block;height:100%;border-radius:8px;background:#81d8ac}.tab{display:none}.tab.active{display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#102a38;display:flex;justify-content:center;border-top:1px solid #456577;padding:8px 0 max(8px,env(safe-area-inset-bottom))}nav button{border:0;color:#d4e7ed;background:transparent;min-width:72px;padding:8px;font-size:12px}nav button.active{background:#315565;border-radius:8px;color:#ffdfa2}select{width:100%;padding:10px;color:white;background:#254959;border:1px solid #58788b;border-radius:9px}</style></head><body><main><header><div><small>INTERNATIONAL RESCUE / NINOMIYA</small><h1>🍊 MIKAN BASE</h1><small>二宮ミカン山・秘密救助基地</small></div><span class="badge">● 自律運営</span></header><div class="scene" id="scene"><div class="sun"></div><div class="hill"></div><div class="trees">🍊🌳🍊🌳🍊</div><div class="silo"></div><div class="rocket"></div><div class="tag">SAGAMI BAY / NINOMIYA</div></div><div class="stats"><div class="stat"><small>救助成功</small><b id="total">0</b></div><div class="stat"><small>基地レベル</small><b id="level">1</b></div><div class="stat"><small>待機機体</small><b id="ready">5/5</b></div></div><section id="home" class="tab active"><div class="card"><h2>📡 司令室通信</h2><p id="report"></p><button class="btn" id="rescue">🚨 緊急救助要請を発生</button><button class="btn alt" id="monster">🦖 相模湾・怪獣特別イベント</button><button class="btn alt" id="replay">🚀 発進シークエンス</button></div><div class="card"><h2>基地の運営方針</h2><p class="muted">アプリを閉じている間の任務は、次回の起動時にまとめて計算されます。</p><select id="frequency"><option value="quiet">静かな基地</option><option value="normal">標準運営</option><option value="busy">事件多め</option></select></div></section><section id="fleet" class="tab"><div class="card"><h2>🛩️ 救助機格納庫</h2><div id="vehicles"></div></div></section><section id="crew" class="tab"><div class="card"><h2>🧑‍✈️ 救助隊員</h2><div id="members"></div></div></section><section id="log" class="tab"><div class="card"><h2>📖 救助活動日誌</h2><div id="history"></div></div></section></main><nav><button class="active" data-tab="home">🏠<br>司令室</button><button data-tab="fleet">🚀<br>格納庫</button><button data-tab="crew">👥<br>隊員</button><button data-tab="log">📖<br>日誌</button></nav><script>(()=>{'use strict';const key='mikan-base-v1',fleet=['高速偵察機','大型輸送機','垂直救助ロケット','深海救助艇','宇宙救難機'],people=['副司令官・榊','通信主任・橘','航空隊長・神崎','技術主任・相馬','救助隊長・一ノ瀬','情報分析官・水野'],missions=['北太平洋の遭難船','アルプスの孤立登山者','南米地震の被災者','インド洋の貨物船火災','豪雨で孤立した集落','相模湾沖の救助要請'];let s;try{s=JSON.parse(localStorage.getItem(key))}catch(e){}if(!s||!Array.isArray(s.log))s={last:Date.now(),total:0,frequency:'normal',fleet:fleet.map((name,i)=>({name:'RESCUE-'+(i+1)+' '+name,hp:100,n:0})),crew:people.map(name=>({name,xp:0})),log:[]};function save(){s.last=Date.now();localStorage.setItem(key,JSON.stringify(s))}function log(t){s.log.unshift({date:new Date().toLocaleString('ja-JP'),text:t});s.log=s.log.slice(0,120)}function event(monster=false,quiet=false){const v=s.fleet[Math.floor(Math.random()*5)];if(monster){log('🦖 特別警報！相模湾に巨大怪獣。全救助隊が沿岸の避難誘導に出動し、住民を守りました。')}else{v.n++;v.hp=Math.max(50,v.hp-5);s.total++;log('✅ '+missions[Math.floor(Math.random()*missions.length)]+'の救助完了。'+v.name+'が活躍しました。')}s.crew[Math.floor(Math.random()*6)].xp+=2;if(!quiet){save();draw()}}function advance(){let elapsed=Math.min(30*86400000,Math.max(0,Date.now()-s.last)),steps=Math.floor(elapsed/900000),rate={quiet:.004,normal:.016,busy:.032}[s.frequency]||.016,count=0;for(let i=0;i<steps;i++){s.fleet.forEach(v=>v.hp=Math.min(100,v.hp+.12));if(Math.random()<rate){event(false,true);count++}}if(count)log('📡 帰還報告：不在中に'+count+'件の救助要請に自動対応しました。');save()}function draw(){document.getElementById('total').textContent=s.total;document.getElementById('level').textContent=1+Math.floor(s.total/12);document.getElementById('ready').textContent=s.fleet.filter(v=>v.hp>=55).length+'/5';document.getElementById('report').textContent=s.log.length?s.log[0].text:'司令官、お帰りなさい。世界監視中。各機は待機しています。';document.getElementById('frequency').value=s.frequency;document.getElementById('vehicles').innerHTML=s.fleet.map(v=>'<div class="item"><b>🚀 '+v.name+'</b><small>整備状態 '+Math.round(v.hp)+'% / 任務 '+v.n+'回</small><div class="meter"><i style="width:'+v.hp+'%"></i></div></div>').join('');document.getElementById('members').innerHTML=s.crew.map(p=>'<div class="item"><b>🧑‍✈️ '+p.name+'</b><small>経験値 '+p.xp+' / Lv.'+(1+Math.floor(p.xp/10))+'</small></div>').join('');document.getElementById('history').innerHTML=s.log.length?s.log.map(x=>'<div class="item"><small>'+x.date+'</small><div>'+x.text+'</div></div>').join(''):'<p class="muted">まだ任務記録はありません。</p>'}function launch(){const e=document.getElementById('scene');e.classList.remove('launch');void e.offsetWidth;e.classList.add('launch');setTimeout(()=>e.classList.remove('launch'),3700)}document.getElementById('rescue').onclick=()=>{event();launch()};document.getElementById('monster').onclick=()=>{event(true);launch()};document.getElementById('replay').onclick=launch;document.getElementById('frequency').onchange=e=>{s.frequency=e.target.value;save()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});advance();draw();setInterval(()=>{if(!document.hidden){advance();draw()}},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){advance();draw()}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
